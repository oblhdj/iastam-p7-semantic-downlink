[pytest]
testpaths = tests
# Three tiers. `unit` is given to every test that carries neither of the other two (tests/conftest.py),
# so `pytest -m unit` is the suite that needs no optional package, no dataset and no GPU.
markers =
    unit: pure logic, plus checks of the committed result files; standard analysis environment only
    inference: runs the detector (onnxruntime on CPU) or the learned gate (torch); skipped when the package or the weights are absent
    page: renders demo/dashboard.py with Streamlit's test runner; skipped without streamlit
